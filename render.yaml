services:
  - type: web
    name: lgionrise-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: REDIS_URL
        sync: false
      - key: RATE_LIMIT_TTL
        value: 60
      - key: RATE_LIMIT_MAX
        value: 20
      - key: ACCOUNT_LOCKOUT_MAX_ATTEMPTS
        value: 5
      - key: ACCOUNT_LOCKOUT_DURATION_MINUTES
        value: 30
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
    healthCheckPath: /api/v1/health
